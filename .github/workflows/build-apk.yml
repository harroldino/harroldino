name: Build Fire Stick APK

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p launcher assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp launcher/app/build/outputs/apk/release/app-release.apk command-centre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: command-centre-apk
          path: command-centre.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Command Centre build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: command-centre.apk
          body: |
            Fire Stick home screen, build ${{ github.run_number }} from `${{ github.ref_name }}`.
            Install it with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/command-centre.apk
