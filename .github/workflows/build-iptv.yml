name: Build My TV APK

on:
  push:
    paths:
      - "iptv/**"
      - ".github/workflows/build-iptv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build APK
        run: gradle -p iptv testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp iptv/app/build/outputs/apk/release/app-release.apk my-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-tv-apk
          path: my-tv.apk

      # One release under a fixed tag, replaced on every build, so the download link never changes.
      # It is never marked "latest", so the Command Centre download link keeps working.
      - name: Publish to the mytv release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mytv
          name: My TV (IPTV app)
          make_latest: "false"
          prerelease: true
          files: my-tv.apk
          body: |
            My TV IPTV app. Install it with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/download/mytv/my-tv.apk
